# gpsd drop-in for the Waveshare LoRaWAN/GNSS HAT.
#
# Does three things, in the order systemd runs them:
#
#   ExecStartPre   115200 baud and a 1 Hz fix interval, before gpsd opens
#                  the port                       (see gnssctl init)
#   ExecStartPre   CASIC binary mode -- ProtoMask, NAV message rates, NMEA
#                  off                            (see casic-binary-setup)
#   Environment    tell gpsd to open it at 115200
#
# The receiver is not a u-blox and its identity is not confirmed; what it
# answers and what it ignores is recorded in variants/linux/README.md and in
# gnssctl's own comments, which is also where the baud rate and fix rate are
# set and why.
#
#
# --- why the speed is set in ExecStartPre, not saved in the receiver ---------
#
# Over b5 62 the receiver NAKs CFG-PRT, so gpsd cannot set the speed itself.
# Its native $PCAS command set is reachable over plain NMEA and does work.
#
# That setting is volatile: it survives a gpsd restart but not a power cycle.
# Rather than persist it with $PCAS00 -- a flash write whose success cannot be
# confirmed without physically power-cycling the board -- ExecStartPre simply
# re-applies it on every start. A power cycle is then handled by construction,
# and there is no state in the receiver that has to agree with this file.
#
# The one coupling that matters: Environment= below and the script must stay in
# step. If gpsd opens at 115200 and ExecStartPre did not run, gpsd sees garbage
# and reports no fix. Note gpsd's own speed hunting does NOT rescue this -- it
# was observed sitting at bps=9600 driver=None against a 115200 receiver.
#
# The speed is passed as OPTIONS, not GPSD_OPTIONS. The stock ExecStart is
#     gpsd $GPSD_OPTIONS $OPTIONS $DEVICES
# and Debian's /etc/default/gpsd sets GPSD_OPTIONS but never OPTIONS, so this
# occupies an empty slot instead of fighting for one. Setting GPSD_OPTIONS here
# does NOT work: EnvironmentFile= is applied after a drop-in's Environment= and
# silently wins, which shows up as gpsd running without -s at all.
#
#
# --- why the sentences WERE re-enabled here (HISTORY -- no longer applies) ---
#
# Kept because it is the only written record of what this receiver's class-f0
# numbering actually is, and of which IDs were swept and found dead. But the
# ExecStartPost it describes is gone: the receiver runs in CASIC binary now
# and gpsd builds SKY from NAV-*INFO, not from GSV. See the binary-mode
# section further down. Nothing in this block is executed.
#
# gpsd sets its own message list on every device activation, which leaves NMEA
# off entirely, so it never builds a SKY object and the satellite table stays
# empty. The UBX routes to the same data are dead ends here: the receiver ACKs
# NAV-SVINFO (01,30) and NAV-SAT (01,35) and then emits neither. NMEA is the
# only thing that works. CFG-MSG is RAM-only, hence per-start.
#
# The IDs below are u-blox message numbers, NOT $PCAS03 field positions. Those
# two agree for the first six sentences and then diverge, which is a trap worth
# naming: $PCAS03 orders them GGA,GLL,GSA,GSV,RMC,VTG,ZDA,ANT, so ZDA looks
# like 06 and ANT like 07. Probed on the hardware, ZDA is 08 and ANT is 41.
#
#   f0,00 GGA   fix quality, HDOP, altitude, satellites used
#   f0,01 GLL   position + validity
#   f0,02 GSA   which satellites are in the fix, one per constellation.
#               Without it every satellite reports used=false and uSat stays 0.
#   f0,03 GSV   satellites in view (elevation/azimuth/SNR)
#   f0,04 RMC   position, course, speed, date
#   f0,05 VTG   course and speed over ground
#   f0,08 ZDA   date and time
#   f0,41 ANT   antenna status, as $GPTXT,01,01,01,ANTENNA OK
#
# Those eight are the complete inventory -- exactly the eight rate fields of
# $PCAS03. Every other class-f0 ID (06, 07, 09, 0a-0f) was swept on hardware:
# all nine ACK and none emits anything. This receiver ACKs message IDs it has
# no sentence for, so an ACK from ubxtool is not evidence that a setting took
# effect. There is no GST, so gpsd reports no epx/epy/epv from this device.
#
# ANT is the exception to the "gpsd turns everything off" rule: f0,41 is not in
# the standard set gpsd knows to disable, so it survives a gpsd restart. It is
# still listed below, because a cold boot starts it at the receiver's own
# default rate rather than at ours.
#
#
# --- the fix rate: 1 Hz, and why 5 Hz was given up ---------------------------
#
# CHANGED 2026-08-23, from a 200 ms fix interval to 1000 ms. The single control
# is INIT_INTERVAL_MS in gnssctl, which `gnssctl init` sends as $PCAS02 once
# the CFG-PRT readback has proved the port really is at 115200. Everything
# downstream follows it: casic-binary-setup enables every NAV message at "one
# per epoch", so all seven track this interval together and no rate divisor
# has to be touched.
#
# WHY. The L76K hard-hangs every few days -- it stops dead from perfect health
# with its I/O pads still driven and its core no longer executing, and only
# removing power revives it. Both occurrences with pin detail left 1PPS
# latched HIGH, and PPS is high only ~100 ms in every 1000, so the halt is not
# uniformly distributed in time: it lands inside the module's post-epoch
# processing. Its last complete frame arrived within the same millisecond as
# the PPS edge it then failed to release. That implicates the per-epoch
# firmware path, and the fix rate is the one multiplier on that path we
# control -- five nav solutions a second across four constellations with 22-26
# satellites, formatting seven CASIC messages per epoch, three of them
# variable length and sized by the satellite count.
#
# The 10 Hz result below is the sharpest evidence that this chip is already
# near its compute limit with this sky: at 10 Hz it drops roughly every other
# epoch. 5 Hz was running at half its demonstrated breaking point.
#
# This is a HYPOTHESIS under test, not a diagnosis. It is worth running
# because it costs nothing (see the table) and because the alternative --
# waiting for the next hang with no variable changed -- learns nothing either.
# What actually settles it is the raw-byte ring in my-scripts' pimesh/gnss:
# if the next hang's last frame is TRUNCATED the module died formatting
# output and the rate is implicated; if it is COMPLETE and then silent, the
# output path is innocent and this can be reverted.
#
# Rate is a divisor on the fix interval, so at today's 1000 ms interval a rate
# of 1 is 1 Hz. Everything is at rate 1 except ANT, where an antenna-fault
# check every epoch buys nothing.
#
# Everything shares one UART, and gpsd's fix -- the sample chrony reads from
# SHM 0 -- comes from UBX NAV-TIMEGPS in that same stream. NMEA does not
# compete with chrony for a parser, it competes for the wire, and an epoch
# carrying a GSA/GSV burst delivers its NAV-TIMEGPS late. Measured on this
# board with chrony's GPS refclock offset as the readout:
#
#     9600   1 Hz  GSA 1 / GSV 5     436 B/s (45%)   mean +188.5 ms  sd  21.3
#     9600   1 Hz  GSA 5 / GSV 5     315 B/s (33%)   mean  -16.3 ms  sd  10.0
#     9600   1 Hz  GSA 2 / GSV 2     497 B/s (52%)   mean +199.1 ms  sd 147.2
#   115200   1 Hz  GSA 5 / GSV 5     321 B/s (2.8%)  mean  -88.3 ms  sd   6.8
#   115200   1 Hz  GSA 1 / GSV 1     849 B/s (7.4%)  mean  -29.4 ms  sd   6.4
#   115200   1 Hz  all 8 sentences   957 B/s (8.3%)  mean -195   ms  sd   5.1
#   115200   5 Hz  pos 5Hz/sats 1Hz 2880 B/s (25.0%) mean -166   ms  sd   6.6
#   115200   5 Hz  all 8 (this file) 5217 B/s (45.3%) mean -166   ms  sd   8.8
#
# At 9600 the fraction of epochs carrying a burst is what governs the result,
# because chrony's median filter is what rejects them: at rate 5 one epoch in
# five is congested and gets treated as an outlier, but at rate 2 half are, the
# filter can no longer tell which population is real, and the samples go
# bimodal -- sd jumps 16x and the spread approaches the 0.4 s that "lock GPS"
# needs to number the PPS seconds. At rate 1 every epoch is congested and it
# becomes a flat offset instead; at 9600 that was +523 ms.
#
# At 115200 the burst takes a twelfth as long to clock out and the effect
# collapses -- which is exactly why dropping BACK to 1 Hz is free. Read the
# last two rows again: 5 Hz did not buy accuracy, it cost a little (sd 8.8 ms
# against 6.6 ms for the lighter set at the same mean). The only thing it ever
# bought was fresher SHM samples, and freshness is worth nothing here: that
# source is `noselect` and exists solely to NUMBER the PPS seconds, a job with
# a +/-0.5 s budget against a residual of ~0.13 s. PPS itself stays at exactly
# 1.00 Hz regardless; it is derived from UTC, not from the navigation
# solution, so the fix rate does not disturb it.
#
# The number to watch is NOT the percentage but the headroom: at 5 Hz, 1087
# bytes per epoch was 94 ms of transmission inside a 208 ms window -- roughly
# 2.2x of margin, which a better sky or another constellation would eat into.
# Should a burst ever exceed the fix interval, epochs queue and the refclock
# offset diverges without bound instead of degrading gracefully. At 1 Hz the
# same bytes sit inside a 1000 ms window (~591 B/s measured on the wire, ~5%
# of the link), so that failure mode is now far out of reach.
#
# --- why 10 Hz was rejected (HISTORY -- and the reason 5 Hz was suspect) -----
#
# This predates the move to 1 Hz and no longer decides anything, but do not
# delete it: it is the one direct measurement of where this chip's nav engine
# runs out of compute, and it is what makes the hang hypothesis above more
# than a guess.
#
# 10 Hz was tried and rejected on evidence, not on the byte budget. The chip
# accepts it -- $PCAS02,100 is ignored, but CASIC CFG-RATE takes it and reads
# back interval_ms=100 -- and the nav engine really does run at 10 Hz: GGA
# timestamps land on a clean 100 ms grid.
#
# It just cannot sustain a solution there with three constellations and ~24
# satellites. It drops roughly every other epoch, non-deterministically, and
# the gaps alternate between 100 and 200 ms for an average of ~5.4 Hz:
#
#   10 Hz nav:  ...124.800 124.900 125.100 125.300 125.400 125.600 125.700...
#    5 Hz nav:  ...533.200 533.400 533.600 533.800 534.000 534.200 534.400...
#
# So the honest choice is between an irregular ~5.4 Hz and a metronomic 5 Hz,
# and for a clock source regularity wins. Timing measured identical either way
# (PPS +130 ns vs +465 ns, both ~175 ns dispersion, GPS refclock sd 8.9 vs
# 8.8 ms) because PPS is UTC-derived and does not care about the fix rate.
#
# 10 Hz might be reachable by cutting back to GPS-only via $PCAS04, which is a
# bad trade here: it would give up 14 of 24 satellites to buy a faster position
# on a stationary repeater.
#
# Read forward from that result: a chip that cannot hold 10 Hz against this
# sky was being asked to hold 5 Hz continuously for days. That is the whole
# argument for the change at the top of this section.
#
#
# 115200 is no longer REQUIRED by the byte budget -- at 1 Hz the traffic is
# ~591 B/s, which even 9600 would carry. It stays anyway, for three reasons
# that have nothing to do with bandwidth: Environment= below opens gpsd at
# 115200 and the two must agree; `gnssctl init` gates the fix-rate send on a
# CFG-PRT readback proving 115200, so at any other speed the rate is silently
# never sent; and the headroom is what keeps a future rate increase from
# needing this file rewritten. Do not "simplify" it back to 9600.
#
# --- why ExecStartPre calls a program, not an inline command -----------------
#
# The $PCAS sentences contain a '$' and a CR/LF, and systemd applies its own
# $-expansion and C-escape processing to Exec lines before anything downstream
# ever sees them -- a quoting trap that fails silently, the receiver simply
# never seeing a valid sentence. A separate program sidesteps it: gnssctl
# builds and writes the sentences internally rather than taking them as argv.
#
# --- what changed from gnss-set-baud, the script this replaced ---------------
#
# gnss-set-baud sent $PCAS02,200 (the fix rate) blind, right after the speed
# change and deliberately only there, with no way to confirm the receiver
# actually followed. It was guarded by placement rather than by a readback:
# $PCAS02,200 happens to be unparseable noise at 9600, so a speed change that
# silently failed still left the receiver at its safe 1 Hz default instead of
# wedged. `gnssctl init` instead reads CFG-PRT back over the CASIC framing
# and sends the fix rate only once that readback proves the port is really
# at 115200; if it cannot prove it, the fix rate is never sent and the port
# is still left at 115200 for gpsd, so the failure surfaces as gpsd's own
# "no data received" rather than a receiver stuck at 5 Hz over a 9600 link.
[Service]
Environment="OPTIONS=-s 115200"
ExecStartPre=/usr/bin/gnssctl init

# --- binary mode -----------------------------------------------------------
#
# The receiver is driven in CASIC binary, not NMEA.  gpsd decodes NAV-PV,
# NAV-TIMEUTC, NAV-DOP and the three NAV-*INFO satellite messages, which
# between them carry everything the NMEA sentence set carried, in about
# 1.7x less wire traffic and with pseudorange residuals NMEA cannot
# express.
#
# casic-binary-setup does the whole job in ExecStartPre, before gpsd opens
# the port: ProtoMask, the NAV message rates, and switching the NMEA
# sentences off.  See that script for why all three have to be set
# together, and for how to recover a receiver that has been left mute.
#
# The ubxtool ExecStartPost that used to be here is gone.  It re-enabled
# the eight NMEA sentences over UBX on every start, which was needed when
# gpsd bound driver_ubx and cleared the sentence mix, and is exactly wrong
# now.  Its u-blox message numbering does not address this chip's
# sentences anyway: class 0xf0 there, 0x4e in CASIC.
#
# Coupled to chrony.  /etc/chrony/chrony.conf's refclock SHM 0 offset is
# derived from when gpsd stamps the epoch, and in binary mode that is at
# the LAST enabled NAV message.  Changing which messages are enabled moves
# the stamp and invalidates the offset.  Measure with ntpshmmon either
# side of any such change.
ExecStartPre=/usr/local/sbin/casic-binary-setup /dev/serial0 115200
