# gpsd drop-in for the Waveshare LoRaWAN/GNSS HAT (Allystar URANUS5 receiver).
#
# Does three things, in the order systemd runs them:
#
#   ExecStartPre   put the receiver at 115200 baud, before gpsd opens the port
#   Environment    tell gpsd to open it at 115200
#   ExecStartPost  turn NMEA GSV/GSA back on, so clients get a satellite view
#
#
# --- why the baud rate is set here, and not saved in the receiver ------------
#
# The receiver is an Allystar URANUS5, not a u-blox. It answers enough of the
# u-blox binary protocol for gpsd's u-blox driver to bind -- NAV output plus
# CFG-MSG -- and NAKs almost everything else: CFG-PRT, CFG-NAV5, CFG-GNSS,
# CFG-SBAS, CFG-TMODE2/3, CFG-RATE, MON-VER, MON-HW. CFG-MSG is very nearly the
# only u-blox message it implements. gpsd is not misdetecting it; the framing on
# the wire really is UBX (b5 62). gpsd does have an Allystar driver, but only
# from 3.26 -- bookworm has 3.22 and trixie has 3.25, so neither can use it, and
# it declines to emit satellite data anyway ("no way to know if a sat used").
#
# So CFG-PRT cannot set the baud rate, but the receiver's *native* Allystar
# command set is reachable over plain NMEA and does work. $PCAS01,5 sets 115200.
#
# That setting is volatile: it survives a gpsd restart but not a power cycle.
# Rather than persist it with $PCAS00 -- a flash write whose success cannot be
# confirmed without physically power-cycling the board -- ExecStartPre simply
# re-applies it on every start. A power cycle is then handled by construction,
# and there is no state in the receiver that has to agree with this file.
#
# The one coupling that matters: Environment= below and the script must stay in
# step. If gpsd opens at 115200 and ExecStartPre did not run, gpsd sees garbage
# and reports no fix. Note gpsd's own speed hunting does NOT rescue this -- it
# was observed sitting at bps=9600 driver=None against a 115200 receiver.
#
# The speed is passed as OPTIONS, not GPSD_OPTIONS. The stock ExecStart is
#     gpsd $GPSD_OPTIONS $OPTIONS $DEVICES
# and Debian's /etc/default/gpsd sets GPSD_OPTIONS but never OPTIONS, so this
# occupies an empty slot instead of fighting for one. Setting GPSD_OPTIONS here
# does NOT work: EnvironmentFile= is applied after a drop-in's Environment= and
# silently wins, which shows up as gpsd running without -s at all.
#
# Belt and braces: gnss-set-baud also leaves the port itself at 115200, and gpsd
# adopts the speed it finds. Either mechanism alone brings the link up.
#
#
# --- why GSV/GSA are enabled, and why the rate is 1 --------------------------
#
# gpsd sets its own message list on every device activation, which leaves NMEA
# off entirely, so it never builds a SKY object and the satellite table stays
# empty. The UBX routes to the same data are dead ends here: the receiver ACKs
# NAV-SVINFO (01,30) and NAV-SAT (01,35) and then emits neither. NMEA GSV/GSA
# is the only thing that works. CFG-MSG is RAM-only, hence per-start.
#
#   f0,03 = GSV, satellites in view (elevation/azimuth/SNR)
#   f0,02 = GSA, which ones are in the fix. Without it every satellite reports
#           used=false and uSat stays 0.
#
# Rate 1 is only affordable because of the 115200 above, and the reason is worth
# recording. Everything shares one UART, and gpsd's fix -- the sample chrony
# reads from SHM 0 -- comes from UBX NAV-TIMEGPS in that same stream. NMEA does
# not compete with chrony for a parser, it competes for the wire, and an epoch
# carrying a GSA/GSV burst delivers its NAV-TIMEGPS late. Measured on this board
# with chrony's GPS refclock offset as the readout:
#
#     9600   GSA 1 / GSV 5   436 B/s (45%)   mean +188.5 ms  sd  21.3  spread  79 ms
#     9600   GSA 5 / GSV 5   315 B/s (33%)   mean   -16.3 ms  sd  10.0  spread  27 ms
#     9600   GSA 2 / GSV 2   497 B/s (52%)   mean +199.1 ms  sd 147.2  spread 369 ms
#   115200   GSA 5 / GSV 5   321 B/s ( 2.8%) mean  -88.3 ms  sd   6.8  spread  20 ms
#   115200   GSA 1 / GSV 1   849 B/s ( 7.4%) mean  -29.4 ms  sd   6.4  spread  16 ms
#
# At 9600 the fraction of epochs carrying a burst is what governs the result,
# because chrony's median filter is what rejects them: at rate 5 one epoch in
# five is congested and gets treated as an outlier, but at rate 2 half are, the
# filter can no longer tell which population is real, and the samples go bimodal
# (+310 ms and -48 ms) -- sd jumps 16x and the spread approaches the 0.4 s that
# "lock GPS" needs to number the PPS seconds. At rate 1 every epoch is congested
# and it becomes a flat offset instead; at 9600 that was +523 ms.
#
# At 115200 the burst takes a twelfth as long to clock out and the whole effect
# collapses, so rate 1 -- the worst setting at 9600 -- becomes the best measured
# anywhere: tightest jitter, and a one-second satellite view.
#
# If you revert to 9600, put BOTH rates back to 5. Leaving them at 1 reproduces
# the +523 ms failure.
[Service]
Environment="OPTIONS=-s 115200"
ExecStartPre=/usr/local/sbin/gnss-set-baud /dev/ttyAMA0
ExecStartPost=/bin/sh -c "sleep 5; /usr/bin/ubxtool -c 06,01,f0,03,01 >/dev/null 2>&1; /usr/bin/ubxtool -c 06,01,f0,02,01 >/dev/null 2>&1; exit 0"
