#dio2_as_rf_switch = 1
#rx_boosted_gain = 1

# GPS. Leave gps_device unset/empty to disable GPS.
# gps_device = /dev/ttyACM0    # serial NMEA: /dev/ttyUSB0, /dev/serial/by-id/...
# gps_device = gpsd://         # or read from gpsd (default 127.0.0.1:2947), which
#                              #   lets gpsd+chrony discipline the host clock
# gps_baud = 9600              # 4800/9600/19200/38400/57600/115200; serial only
# gps_en_pin = 4               # GPIO held HIGH to wake a GPS that boots in standby
#                              #   (e.g. L76K STANDBY on the Waveshare LoRaWAN/GNSS HAT)

# defer_clock overrides whether meshcored sets the system clock from GPS/mesh
# time sync. Unset (default): on exactly when gps_device is gpsd:// above.
# true: never set the clock, even without gpsd:// -- e.g. a serial gps_device
# whose NMEA is separately fed to chrony. false: always attempt to set it,
# even against a gpsd:// device -- bounded, because a step of the system clock
# also steps millis(). See "Disciplining the host clock from GNSS" in README.md.
# defer_clock = true
